<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="calendar">

            <!-- Calendar Header -->
            <div class="calendar-header">
                <div class="header-title">
                    <span class="calendar-icon">📅</span>
                    <h2>Select Date</h2>
                </div>

                <p>Choose your preferred date</p>
            </div>

            <!-- Month Navigation -->
            <div class="month-navigation">

                <button class="nav-btn" aria-label="Previous month">
                    &#10094;
                </button>

                <h3>November 2026</h3>

                <button class="nav-btn" aria-label="Next month">
                    &#10095;
                </button>

            </div>

            <!-- Weekdays -->
            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <!-- Calendar Dates -->
            <div class="dates">

                <!-- Previous Month -->
                <div class="other-month">26</div>
                <div class="other-month">27</div>
                <div class="other-month">28</div>
                <div class="other-month">29</div>
                <div class="other-month">30</div>
                <div class="other-month">31</div>

                <!-- November -->
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>

                <div>8</div>
                <div>9</div>
                <div>10</div>
                <div>11</div>
                <div>12</div>
                <div>13</div>
                <div>14</div>

                <div>15</div>
                <div>16</div>
                <div class="today">17</div>
                <div>18</div>
                <div>19</div>
                <div>20</div>
                <div>21</div>

                <div>22</div>
                <div>23</div>
                <div>24</div>
                <div>25</div>
                <div>26</div>
                <div>27</div>
                <div>28</div>

                <div>29</div>
                <div>30</div>

                <!-- Next Month -->
                <div class="other-month">1</div>
                <div class="other-month">2</div>
                <div class="other-month">3</div>
                <div class="other-month">4</div>
                <div class="other-month">5</div>

            </div>

            <!-- Footer -->
            <div class="calendar-footer">
                <span>Selected Date: November 17, 2026</span>
                <button class="today-btn">Today</button>
            </div>

        </div>

    </div>

</body>
</html>
